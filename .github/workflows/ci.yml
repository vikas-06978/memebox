name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (extension on a fake call page)
        run: npm run test:e2e

      - name: Build extension
        run: npm run build

      - name: Zip for the store
        run: npm run zip

      - name: End-to-end tests against the unzipped store package
        run: |
          rm -rf tests/.tmp/unzipped && mkdir -p tests/.tmp/unzipped
          unzip -q memebox-*.zip -d tests/.tmp/unzipped
          MEMEBOX_EXT=tests/.tmp/unzipped npm run test:e2e

      - name: Upload store-ready zip
        uses: actions/upload-artifact@v4
        with:
          name: memebox-extension
          path: memebox-*.zip
          if-no-files-found: error

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
